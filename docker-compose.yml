version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: blog-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: